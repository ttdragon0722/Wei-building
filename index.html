<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大樓管理費統計</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <header class="topbar no-print">
    <div class="brand">
      <span class="brand-mark">管</span>
      <div>
        <h1>大樓管理費統計</h1>
        <p class="sub">點擊住戶格子即可切換「已繳／未繳」，資料自動存在此瀏覽器</p>
      </div>
    </div>
    <div class="toolbar">
      <label class="field">
        <span>月份</span>
        <input type="month" id="month">
      </label>
      <button type="button" class="btn btn-primary" id="btn-print">🖨 列印 A4</button>
    </div>
  </header>

  <main class="page">
    <!-- 列印用標題 -->
    <div class="print-header">
      <h2 id="print-title"></h2>
      <div class="print-meta">
        <span id="fee-rule"></span>
        <span id="print-date"></span>
      </div>
    </div>

    <section class="summary" aria-label="統計摘要">
      <div class="stat">
        <span class="stat-label">已繳戶數</span>
        <span class="stat-value" id="stat-paid">-</span>
      </div>
      <div class="stat stat-warn">
        <span class="stat-label">未繳戶數</span>
        <span class="stat-value" id="stat-unpaid">-</span>
      </div>
      <div class="stat">
        <span class="stat-label">應收金額</span>
        <span class="stat-value" id="stat-expected">-</span>
      </div>
      <div class="stat stat-good">
        <span class="stat-label">實收金額</span>
        <span class="stat-value" id="stat-received">-</span>
      </div>
      <div class="stat stat-warn">
        <span class="stat-label">未收金額</span>
        <span class="stat-value" id="stat-outstanding">-</span>
      </div>
      <div class="stat">
        <span class="stat-label">收繳率</span>
        <span class="stat-value" id="stat-rate">-</span>
        <div class="rate-track"><div class="rate-bar" id="rate-bar"></div></div>
      </div>
    </section>

    <section class="controls no-print">
      <div class="segmented" role="group" aria-label="篩選">
        <button type="button" data-filter="all">全部</button>
        <button type="button" data-filter="unpaid">只看未繳</button>
        <button type="button" data-filter="paid">只看已繳</button>
      </div>
      <input type="search" id="search" class="search" placeholder="搜尋戶號或姓名，例如 12F-B、陳" maxlength="20">
      <div class="actions">
        <button type="button" class="btn" id="btn-all-paid">全部標記已繳</button>
        <button type="button" class="btn" id="btn-clear">清空本月</button>
        <button type="button" class="btn btn-ghost" id="btn-demo">重載假資料</button>
      </div>
    </section>

    <div class="layout">
      <section class="panel grid-panel">
        <h3 class="panel-title">各樓層繳費狀況</h3>
        <table class="grid">
          <thead>
            <tr><th></th><th>A 戶</th><th>B 戶</th><th>C 戶</th><th>D 戶</th></tr>
          </thead>
          <tbody id="grid-body"></tbody>
        </table>
      </section>

      <section class="panel unpaid-panel">
        <h3 class="panel-title">未繳名單 <span class="count" id="unpaid-count"></span></h3>
        <table class="list">
          <thead>
            <tr><th class="num">#</th><th>戶號</th><th>住戶</th><th class="num">坪數</th><th class="num">應繳</th><th class="note-cell">備註</th></tr>
          </thead>
          <tbody id="unpaid-body"></tbody>
        </table>
        <p class="empty" id="unpaid-empty" hidden>🎉 本月全部繳清！</p>
      </section>
    </div>

    <footer class="signatures">
      <div>製表人：</div>
      <div>財務委員：</div>
      <div>主任委員：</div>
    </footer>
  </main>

  <div class="toast no-print" id="toast" role="status" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
